[project]
name = "notion-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask==2.2.2",
    "Werkzeug==2.2.2",
    "Flask-SQLAlchemy==3.0.3",
    "Flask-Migrate==3.1.0",
    "Flask-Marshmallow",
    "marshmallow==3.20.1",
    "marshmallow-sqlalchemy",
    "flask-cors",
    "flask-jwt-extended",
    "flask-bcrypt",
    "python-dotenv",
    "psycopg2-binary",
]

[tool.vercel]
entrypoint = "manage:app"
